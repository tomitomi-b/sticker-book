<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子シール帳</title>
  
  <!-- キャッシュ無効化設定 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  
  <!-- スタイルシート (キャッシュ回避バージョン指定) -->
  <link rel="stylesheet" href="./style-new.css?v=100">
</head>
<body>

  <!-- 本の表紙カバー -->
  <div id="book-cover" class="book-cover">
    <div class="cover-content">
      <div class="cover-title">マイ・シールブック</div>
      <div class="cover-subtitle">My Special Sticker Book</div>
      <button id="open-book-btn" class="open-book-btn">シール帳をひらく 📖</button>
    </div>
  </div>

  <!-- シール帳本体 (めくった後の画面) -->
  <div id="sticker-book" class="sticker-book hidden">
    <!-- ヘッダーバー -->
    <div class="book-bar">
      <button id="close-book-btn" class="nav-btn">← 表紙へ</button>
      <h2>マイシール帳</h2>
      <button id="map-toggle-btn" class="nav-btn accent">🗺️ スポットマップ</button>
    </div>

    <!-- メインコンテンツ領域 -->
    <div class="book-body">
      <!-- シール台紙 (ドラッグ＆ドロップ領域) -->
      <div id="sticker-canvas" class="sticker-canvas">
        <div class="canvas-hint">集めたシールをここにドラッグ＆ドロップで貼れるよ！</div>
      </div>

      <!-- 下部トレイ (獲得済みシール置き場) -->
      <div class="sticker-tray">
        <div class="tray-title">集めたシール (スワイプ / ドラッグ)</div>
        <div id="tray-list" class="tray-list"></div>
      </div>
    </div>
  </div>

  <!-- マップ表示用モーダル -->
  <div id="map-modal" class="map-modal hidden">
    <div class="map-modal-header">
      <span>シール収集マップ</span>
      <button id="close-map-btn" class="close-btn">&times;</button>
    </div>
    <div id="map"></div>
  </div>

  <!-- Leaflet Map JS & アプリ本編スクリプト -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="./app.js?v=100"></script>
</body>
</html>
