<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticker Collecting Book</title>
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <link rel="stylesheet" href="./style-new.css?v=300">
</head>
<body>

  <!-- 本の表紙（実物風リアルデザイン） -->
  <div id="book-cover" class="book-cover">
    <div class="notebook">
      <!-- 左側のゴールドダブルリング -->
      <div class="rings">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
      </div>

      <!-- ノートの断面（ゴールド加工） -->
      <div class="gold-edges"></div>

      <!-- 表紙本体 -->
      <div class="cover-body">
        <!-- 箔押しタイトル -->
        <h1 class="foil-title">Sticker Collecting Book</h1>

        <!-- 2羽のオウムモチーフ（ラインアート） -->
        <div class="bird-emboss">
          <svg viewBox="0 0 100 70" class="bird-svg">
            <!-- 小枝 -->
            <path d="M 10,48 Q 50,42 90,52" stroke="#5a8b9f" stroke-width="2" fill="none" stroke-linecap="round" />
            <path d="M 65,46 L 75,52" stroke="#5a8b9f" stroke-width="1.5" fill="none" stroke-linecap="round" />
            <!-- 左のオウム -->
            <path d="M 32,45 C 28,38 28,26 35,20 C 40,16 46,20 46,26 C 46,35 44,40 42,45 Z" stroke="#5a8b9f" stroke-width="1.8" fill="none" />
            <path d="M 33,21 Q 30,23 31,25" stroke="#5a8b9f" stroke-width="1.5" fill="none" />
            <circle cx="37" cy="22" r="1" fill="#5a8b9f" />
            <path d="M 30,30 Q 38,32 38,42" stroke="#5a8b9f" stroke-width="1.5" fill="none" />
            <path d="M 40,43 L 42,55 L 38,50" stroke="#5a8b9f" stroke-width="1.5" fill="none" />
            <!-- 右のオウム -->
            <path d="M 52,44 C 48,37 48,25 55,19 C 60,15 66,19 66,25 C 66,34 64,39 62,44 Z" stroke="#5a8b9f" stroke-width="1.8" fill="none" />
            <path d="M 53,20 Q 50,22 51,24" stroke="#5a8b9f" stroke-width="1.5" fill="none" />
            <circle cx="57" cy="21" r="1" fill="#5a8b9f" />
            <path d="M 50,29 Q 58,31 58,41" stroke="#5a8b9f" stroke-width="1.5" fill="none" />
            <path d="M 60,42 L 62,54 L 58,49" stroke="#5a8b9f" stroke-width="1.5" fill="none" />
          </svg>
        </div>

        <!-- 開くボタン -->
        <button id="open-book-btn" class="open-book-btn">シール帳をひらく 📖</button>

        <!-- ゴムバンドと鳥チャーム -->
        <div class="elastic-band">
          <div class="bird-charm">
            <svg viewBox="0 0 30 30" class="charm-svg">
              <path d="M 15,3 C 15,3 17,2 18,4 C 19,6 18,8 18,8 C 22,10 24,14 23,19 C 22,23 18,26 14,26 C 11,26 8,24 8,21 C 8,18 10,16 13,16 C 11,12 12,8 15,3 Z" fill="url(#goldGradient)" />
              <circle cx="16" cy="6" r="0.8" fill="#7a5210" />
              <defs>
                <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffe082" />
                  <stop offset="50%" stop-color="#d4af37" />
                  <stop offset="100%" stop-color="#aa7c11" />
                </linearGradient>
              </defs>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- シール帳本体（見開きノート形式） -->
  <div id="sticker-book" class="sticker-book hidden">
    <!-- 上部ナビゲーション -->
    <div class="book-bar">
      <button id="close-book-btn" class="nav-btn">← 表紙へ</button>
      <div class="page-controls">
        <button id="prev-page-btn" class="nav-btn page-btn">◀ 前のページ</button>
        <span id="page-num-display" class="page-num">1 / 3 ページ</span>
        <button id="next-page-btn" class="nav-btn page-btn">次のページ ▶</button>
      </div>
      <button id="map-toggle-btn" class="nav-btn accent">🗺️ スポットマップ</button>
    </div>

    <!-- 3D ページめくりコンテナ -->
    <div class="book-viewport">
      <div class="book-body">
        <div id="sticker-canvas" class="sticker-canvas">
          <div class="ring-spine"></div>
          <div class="canvas-hint">集めたシールをドラッグ＆ドロップ！左右スワイプでページめくり 👈👉</div>
        </div>
      </div>
    </div>

    <!-- 下部トレイ -->
    <div class="sticker-tray">
      <div class="tray-title">集めたシール (タップまたはドラッグで移動)</div>
      <div id="tray-list" class="tray-list"></div>
    </div>
  </div>

  <!-- マップモーダル -->
  <div id="map-modal" class="map-modal hidden">
    <div class="map-modal-header">
      <span>シール収集マップ</span>
      <button id="close-map-btn" class="close-btn">&times;</button>
    </div>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="./app.js?v=300"></script>
</body>
</html>
