<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子シール帳</title>
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <link rel="stylesheet" href="./style-new.css?v=201">
</head>
<body>

  <!-- 本の表紙（折りたたみスタート画面） -->
  <div id="book-cover" class="book-cover">
    <div class="cover-content">
      <div class="ring-spine-left"></div>
      <div class="cover-title">Sticker Collecting Book</div>
      <div class="cover-subtitle">✨ マイシールコレクション ✨</div>
      <button id="open-book-btn" class="open-book-btn">シール帳をひらく 📖</button>
    </div>
  </div>

  <!-- シール帳本体（見開きノート形式） -->
  <div id="sticker-book" class="sticker-book hidden">
    <!-- 上部ナビゲーション -->
    <div class="book-bar">
      <button id="close-book-btn" class="nav-btn">← 表紙へ</button>
      <div class="page-controls">
        <button id="prev-page-btn" class="nav-btn page-btn">◀ 前のページ</button>
        <span id="page-num-display" class="page-num">1 / 3 ページ</span>
        <button id="next-page-btn" class="nav-btn page-btn">次のページ ▶</button>
      </div>
      <button id="map-toggle-btn" class="nav-btn accent">🗺️ スポットマップ</button>
    </div>

    <!-- 3D ページめくり用コンテナ -->
    <div class="book-viewport">
      <div class="book-body">
        <div id="sticker-canvas" class="sticker-canvas">
          <div class="ring-spine"></div>
          <div class="canvas-hint">集めたシールをドラッグ＆ドロップ！左右スワイプでページめくり 👈👉</div>
        </div>
      </div>
    </div>

    <!-- 下部トレイ -->
    <div class="sticker-tray">
      <div class="tray-title">集めたシール (タップまたはドラッグで移動)</div>
      <div id="tray-list" class="tray-list"></div>
    </div>
  </div>

  <!-- マップモーダル -->
  <div id="map-modal" class="map-modal hidden">
    <div class="map-modal-header">
      <span>シール収集マップ</span>
      <button id="close-map-btn" class="close-btn">&times;</button>
    </div>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="./app.js?v=201"></script>
</body>
</html>
